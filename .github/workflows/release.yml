# Builds, signs and publishes the Zebu browser extension for Chrome, Firefox
# and Safari (board #287).
#
# Trigger: push a tag `vX.Y.Z` (scripts/release.sh does that; docs/release.md).
# The tag must match the version in package.json. One job builds all three
# targets from the one source, submits the Firefox package to its public
# listing on addons.mozilla.org and uploads the Chrome package to the Web
# Store; the `publish` job then puts every package in the Cloudflare R2
# bucket behind https://app-downloads.zebu.work, where the downloads page
# reads from. Chrome copies update through the Web Store only, and Firefox
# copies through AMO, so the R2 copies are the archive and the load-unpacked
# source; `extension/firefox/updates.json` on R2 remains for the Firefox
# copies installed from our bucket before the listing existed (their
# manifest names it) and moves them onto the listed build (docs/release.md).
#
# Every job runs on hosted runners, never on Alan's own machines: the repo is
# public, so its code must not execute on a private runner. Every job runs on
# Blacksmith, like the desktop app; the Safari job on its macOS runner for
# Xcode's converter.

# `workflow_dispatch` runs the same build and the same publish without
# touching anything real: it writes to `extension/_dryrun/<run id>/` instead
# of `extension/` and skips the stores. Nothing in this workflow deletes
# anything from the bucket.
#
# Store credentials are optional and switched on purely by which secrets exist:
#   Firefox  AMO_JWT_ISSUER, AMO_JWT_SECRET                → listed on AMO; once Mozilla
#            approves, the signed .xpi + updates.json (without them the release
#            ships a source zip and nothing reaches AMO)
#   Chrome   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID
#            → upload + publish to the Web Store
#   Safari   APPLE_TEAM_ID (+ the desktop's signing secrets later) → the Xcode
#            project is built and attached as an artifact; App Store submission
#            is not automated yet.
# Publishing needs R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  R2_BUCKET: app-downloads
  PUBLIC_BASE: https://app-downloads.zebu.work
  GECKO_ID: extension@zebu.work
  # How long the build job waits for Mozilla to approve a listed version
  # before releasing without the signed file (seconds). Auto-approval takes
  # minutes; a human review can take days, and the runner is shared with the
  # web app's deploys, so this is bounded and a re-run picks the file up later.
  AMO_APPROVAL_WAIT: 900

jobs:
  verify:
    name: Version and release scripts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gate
        run: |
          npm run build
          npm run typecheck
          npm test
          npm run i18n:check
      - name: Test the release scripts
        run: bash scripts/tests/publish-r2.test.sh
      - name: Compare tag with package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const tag = process.env.TAG.replace(/^v/, "");
            const pkg = require("./package.json").version;
            if (tag !== pkg) { console.error(`Tag v${tag} does not match package.json (${pkg}).`); process.exit(1); }
            console.log(`Releasing ${tag}`);
          '

  build:
    name: Build and sign the packages
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Build every target and zip it
        id: version
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p upload
          cp dist/zebu-*-"$VERSION".zip upload/
          ls -l upload

      # Firefox ships through the public listing on addons.mozilla.org. The
      # package carries no update_url (the linter refuses one in a listed
      # package), so a copy running a listed version updates from AMO itself.
      # web-ext submits the version to the listed channel with the listing
      # metadata (amo/listing.json) and the source for the reviewers, and
      # returns at once: Mozilla signs the file only after review, so
      # scripts/amo.mjs then waits a bounded time for the signed .xpi. With
      # it, the release also refreshes extension/firefox/updates.json on R2,
      # the bridge for the copies installed from our bucket before the
      # listing: their manifest still names updates.json, they install this
      # signed listed file from R2, and from then on update from AMO. Without
      # it (review still open) the release goes out anyway with the source
      # zip; a re-run of the workflow after approval finds the version on AMO,
      # submits nothing, downloads the file and publishes the bridge.
      - name: Submit the Firefox package to addons.mozilla.org and fetch the signed file
        env:
          HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$HAS_AMO" != "true" ]; then
            echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set: the Firefox package was not submitted to addons.mozilla.org and ships unsigned. See docs/release.md."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: not submitting to AMO"
            exit 0
          fi
          xpi="upload/zebu-firefox-$VERSION.xpi"
          # Already on AMO (a re-run after a review that outlasted the wait)?
          state=0
          node scripts/amo.mjs await-signed --id "$GECKO_ID" --version "$VERSION" --out "$xpi" --wait 0 || state=$?
          if [ "$state" = 3 ]; then
            # The reviewers rebuild the package from this (README, "Reproducing a build").
            git archive --format=zip --prefix="zebu-browser-extension-$VERSION/" -o source.zip HEAD
            npx --yes web-ext@8 sign \
              --source-dir dist/firefox \
              --artifacts-dir web-ext-artifacts \
              --channel listed \
              --amo-metadata amo/listing.json \
              --upload-source-code source.zip \
              --approval-timeout 0
            node scripts/amo.mjs set-policy --id "$GECKO_ID" --file amo/privacy-policy.md \
              || echo "::warning::could not set the privacy policy on the AMO listing; set it by hand from amo/privacy-policy.md (developer hub → Edit Product Page)."
            state=0
            node scripts/amo.mjs await-signed --id "$GECKO_ID" --version "$VERSION" --out "$xpi" --wait "$AMO_APPROVAL_WAIT" || state=$?
          fi
          case $state in
            0) ls -l upload ;;
            2) echo "::warning::$VERSION is awaiting Mozilla's review: this release ships the Firefox source zip, and extension/firefox/updates.json keeps its previous version. Re-run this workflow once the version is approved to publish the signed file (docs/release.md)." ;;
            *) echo "::error::addons.mozilla.org did not accept $VERSION (exit $state)"; exit 1 ;;
          esac

      # The Chrome Web Store is the only place Chrome updates from. Uploads
      # the new package and publishes it; the review happens on Google's side.
      - name: Upload to the Chrome Web Store
        env:
          HAS_CWS: ${{ secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_EXTENSION_ID != '' }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$HAS_CWS" != "true" ]; then
            echo "::warning::CWS_* secrets are not set: the Chrome package was not uploaded to the Web Store. See docs/release.md."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: not touching the Web Store"
            exit 0
          fi
          VERSION=${{ steps.version.outputs.version }}
          token=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).access_token')
          # A re-run of the workflow (to fetch a Firefox file approved after the
          # first run) must not try to upload the same version twice: the store
          # refuses a version that is not greater than the one it holds.
          current=$(curl -fsS "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID?projection=DRAFT" \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).crxVersion || ""') || current=""
          if [ "$current" = "$VERSION" ]; then
            echo "the Web Store already holds $VERSION (a re-run): nothing to upload"
            exit 0
          fi
          upload=$(curl -fsS -X PUT "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T "upload/zebu-chrome-$VERSION.zip")
          echo "$upload"
          echo "$upload" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); if (r.uploadState !== "SUCCESS") { console.error("upload not accepted"); process.exit(1); }'
          curl -fsS -X POST "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish" \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0"

      - uses: actions/upload-artifact@v4
        with:
          name: zebu-extension-packages
          path: upload/
          if-no-files-found: error

  safari:
    name: Safari app (Xcode project)
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build:safari
      # The converter wraps dist/safari in a macOS app project. It is built
      # here so a release always carries the exact project a store submission
      # would use; signing and App Store Connect follow once the Apple side is
      # confirmed (docs/release.md).
      - name: Wrap the Safari build in an Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun safari-web-extension-converter dist/safari \
            --project-location safari-app --app-name Zebu --bundle-identifier work.zebu.extension \
            --macos-only --no-open --no-prompt --force
          (cd safari-app && zip -qr "../zebu-safari-xcode-${{ needs.build.outputs.version }}.zip" .)
          ls -l zebu-safari-xcode-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: zebu-safari-xcode
          path: zebu-safari-xcode-*.zip

  publish:
    name: Publish to R2
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # The one variable that separates a release from a rehearsal.
      DEST_BASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'extension' || format('extension/_dryrun/{0}', github.run_id) }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the R2 credentials are present
        env:
          HAS_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAS_R2" != "true" ]; then
            echo "::error::R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set on $GITHUB_REPOSITORY (the same token the desktop repository uses works). See docs/release.md."
            exit 1
          fi

      - name: AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          fi
          aws --version

      - uses: actions/download-artifact@v4
        with:
          name: zebu-extension-packages
          path: upload

      - name: Build latest.json, the aliases and Firefox's updates.json
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
        run: |
          store=""
          [ -n "$CWS_EXTENSION_ID" ] && store="--chrome-store https://chromewebstore.google.com/detail/$CWS_EXTENSION_ID"
          # The listing URL is the slug in amo/listing.json, the one place it is set.
          [ "$HAS_AMO" = "true" ] && store="$store --firefox-store https://addons.mozilla.org/firefox/addon/$(node -p "require('./amo/listing.json').slug")/"
          # No signed .xpi (Mozilla's review still open): latest.json serves the
          # source zip and updates.json is left as it was, so no installed copy
          # is pointed at a file that does not exist.
          updates=""
          [ -f "upload/zebu-firefox-$VERSION.xpi" ] && updates="--updates-out updates.json"
          # shellcheck disable=SC2086
          node scripts/extension-manifest.mjs \
            --version "$VERSION" --dir upload \
            --base-url "$PUBLIC_BASE/$DEST_BASE/$VERSION" \
            --gecko-id "$GECKO_ID" \
            --aliases-out aliases.tsv $updates $store > latest.json
          echo "latest.json:"; cat latest.json
          echo "aliases:"; cat aliases.tsv
          if [ -f updates.json ]; then echo "updates.json:"; cat updates.json; echo "ALSO=--also firefox/updates.json=updates.json" >> "$GITHUB_ENV"; fi

      - name: Publish to R2 and read it back
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # shellcheck disable=SC2086
          scripts/publish-r2.sh publish \
            --bucket "$R2_BUCKET" --base "$DEST_BASE" --version "$VERSION" \
            --dir upload --manifest latest.json --aliases aliases.tsv ${ALSO:-} \
            --public-base "$PUBLIC_BASE"

      - name: Summarise
        run: |
          {
            if [ "$DEST_BASE" = extension ]; then
              echo "### Published Zebu browser extension $VERSION"
              echo
              echo "- manifest: \`$PUBLIC_BASE/extension/latest.json\`"
              echo "- this build: \`$PUBLIC_BASE/extension/$VERSION/\` (kept forever)"
              echo "- download aliases: \`$PUBLIC_BASE/extension/latest/\`"
              echo "- Firefox listing: \`https://addons.mozilla.org/firefox/addon/$(node -p "require('./amo/listing.json').slug")/\`"
              if [ -n "${ALSO:-}" ]; then
                echo "- Firefox bridge for copies installed from the bucket: \`$PUBLIC_BASE/extension/firefox/updates.json\`"
              else
                echo "- Firefox: no signed file yet (review open, or no AMO credentials); updates.json unchanged. Re-run after approval."
              fi
            else
              echo "### Dry run — nothing real was written"
              echo
              echo "Everything went to \`$DEST_BASE/\`: the same code, credentials and ordering as a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
